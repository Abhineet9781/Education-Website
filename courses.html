<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Courses - Edtech</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f6f7fb] text-slate-800 antialiased">

<header class="border-b border-slate-200 bg-white/90 backdrop-blur sticky top-0 z-20 shadow-sm">
  <div class="max-w-6xl mx-auto px-5 h-[70px] flex items-center justify-between">
    <a href="index.html" class="text-xl font-bold tracking-tight">Ed<span class="text-sky-600">tech</span></a>
    <nav class="flex gap-7 text-sm font-medium text-slate-600">
      <a href="index.html" class="hover:text-slate-900 transition">Home</a>
      <a href="courses.html" class="hover:text-slate-900 transition">Courses</a>
      <a href="index.html#testimonials" class="hover:text-slate-900 transition">Reviews</a>
    </nav>
  </div>
</header>

<section class="py-14 text-center border-b border-slate-200 bg-white">
  <div class="max-w-6xl mx-auto px-5">
    <h1 class="text-3xl font-bold mb-2 text-slate-900">All Courses</h1>
    <p class="text-slate-600">Browse a curated set of courses built for practical learning.</p>
  </div>
</section>

<section class="border-b border-slate-200 bg-white py-5">
  <div class="max-w-6xl mx-auto px-5 flex flex-wrap gap-4 items-center justify-between">
    <input type="text" id="searchInput" placeholder="Search courses by title..."
      class="flex-1 min-w-[240px] border border-slate-200 rounded-full px-4 py-3 text-sm focus:outline-none focus:border-slate-900 shadow-sm">
    <div class="flex flex-wrap gap-2" id="categoryFilters">
      <button class="cat-btn active px-4 py-2 rounded-full text-sm font-medium border border-slate-200 bg-slate-900 text-white shadow-sm" data-category="all">All</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm font-medium border border-slate-200 bg-white text-slate-600" data-category="Development">Development</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm font-medium border border-slate-200 bg-white text-slate-600" data-category="Design">Design</button>
      <button class="cat-btn px-4 py-2 rounded-full text-sm font-medium border border-slate-200 bg-white text-slate-600" data-category="Marketing">Marketing</button>
    </div>
  </div>
</section>

<section class="py-16">
  <div class="max-w-6xl mx-auto px-5">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="courseListGrid"></div>
    <p class="hidden text-center text-slate-500 py-10" id="emptyState">No courses match that search right now.</p>
  </div>
</section>

<footer class="bg-slate-900 text-white text-center text-sm py-6">
  <p>&copy; 2026 Edtech</p>
</footer>

<script src="js/courses.js"></script>
<script src="js/courses-page.js"></script>
</body>
</html>
